server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. TLS termination and HSTS belong at the edge in production.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Single-page application routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API is proxied through the same origin so the session cookie is
  # first-party and no cross-site request is needed.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  # Never cache the shell; hashed assets are immutable.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

# Local development stack for the Secure Examination Management and Delivery
# Platform proof of concept.
#
#   docker compose up --build
#
# The API defaults to in-process adapters (PERSISTENCE_DRIVER=memory) so it runs
# with no infrastructure at all. The services below provide the production-shaped
# dependencies; switch the drivers in the api service environment to use them.
#
# Every credential in this file is a development placeholder. Do not deploy it.

name: secure-exam-poc

services:
  postgres:
    image: postgres:16-alpine
    container_name: sep-postgres
    environment:
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: development-only-password
      POSTGRES_DB: secure_exam
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sep -d secure_exam']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sep-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: sep-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sep-development
      MINIO_ROOT_PASSWORD: development-only-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the evidence bucket once MinIO is healthy.
  minio-init:
    image: minio/mc:RELEASE.2024-07-11T18-01-28Z
    container_name: sep-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sep-development development-only-secret &&
      mc mb --ignore-existing local/exam-evidence &&
      mc anonymous set none local/exam-evidence &&
      echo 'Evidence bucket ready (private, no anonymous access).'
      "

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    container_name: sep-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: '4000'
      HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:5173
      SESSION_SECRET: development-only-session-secret-change-me-01

      # The POC runs entirely in memory by default. Switch these to postgres /
      # redis / s3 once the corresponding adapters are implemented.
      PERSISTENCE_DRIVER: memory
      CACHE_DRIVER: memory
      OBJECT_STORE_DRIVER: memory

      DATABASE_URL: postgresql://sep:development-only-password@postgres:5432/secure_exam
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: exam-evidence
      S3_ACCESS_KEY: sep-development
      S3_SECRET_KEY: development-only-secret

      # Local development keys only. The API refuses to start in production
      # with KEY_PROVIDER=local.
      KEY_PROVIDER: local
      ENABLE_DEMO_MODE: 'true'
      ALLOW_SELF_APPROVAL: 'false'
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    container_name: sep-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_ORIGIN: http://api:4000
    ports:
      - '5173:80'

volumes:
  postgres-data:
  minio-data:
